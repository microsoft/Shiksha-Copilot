<div class="flex justify-center items-center min-h-screen bg-gray-100 py-10">
  <div class="bg-white p-8 rounded-lg shadow-lg w-full max-w-md">
    <h2 class="text-2xl font-bold text-center mb-6 text-gray-800">Create New Batch</h2>
    <form [formGroup]="batchForm" (ngSubmit)="onSubmit()" class="space-y-5">
      <div>
        <label for="batchName" class="block text-sm font-medium text-gray-700">Batch Name</label>
        <input
          type="text"
          id="batchName"
          formControlName="batchName"
          class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm p-3 focus:ring-blue-500 focus:border-blue-500"
          placeholder="Enter batch name"
          required
        >
        <div *ngIf="batchForm.get('batchName')?.invalid && batchForm.get('batchName')?.touched" class="text-error">
          Batch Name is required.
        </div>
      </div>

      <div>
        <label for="description" class="block text-sm font-medium text-gray-700">Description</label>
        <textarea
          id="description"
          formControlName="description"
          rows="3"
          class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm p-3 focus:ring-blue-500 focus:border-blue-500"
          placeholder="Provide a brief description"
          required
        ></textarea>
        <div *ngIf="batchForm.get('description')?.invalid && batchForm.get('description')?.touched" class="text-error">
          Description is required.
        </div>
      </div>

      <div>
        <label for="scheduleDate" class="block text-sm font-medium text-gray-700">Schedule Date</label>
        <input
          type="date"
          id="scheduleDate"
          formControlName="scheduleDate"
          class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm p-3 focus:ring-blue-500 focus:border-blue-500"
          required
        >
        <div *ngIf="batchForm.get('scheduleDate')?.invalid && batchForm.get('scheduleDate')?.touched" class="text-error">
          Schedule Date is required.
        </div>
      </div>

      <div>
        <label for="trainingType" class="block text-sm font-medium text-gray-700">Mode of Training</label>
        <select
          id="trainingType"
          formControlName="trainingType"
          class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm p-3 focus:ring-blue-500 focus:border-blue-500"
          required
        >
          <option value="">Select Mode</option>
          <option value="offline">OFFLINE/ Face to Face </option>
          <option value="online">ONLINE/ Virtual</option>
          <option value="School-Level">School-Level</option>
        </select>
        <div *ngIf="batchForm.get('trainingType')?.invalid && batchForm.get('trainingType')?.touched" class="text-error">
          Training Type is required.
        </div>
      </div>

      <div>
        <label for="pdfFile" class="block text-sm font-medium text-gray-700">Upload Permission Letter</label>
        <input
          type="file"
          id="pdfFile"
          (change)="onFileSelected($event)"
          class="mt-1 block w-full text-sm text-gray-900 border border-gray-300 rounded-lg cursor-pointer bg-gray-50 focus:outline-none"
          accept=".pdf"
        >
        <div *ngIf="batchForm.get('pdfFile')?.invalid && batchForm.get('pdfFile')?.touched" class="text-error">
          PDF File is required.
        </div>
      </div>

      <button
        type="submit"
        [disabled]="batchForm.invalid"
        class="w-full px-4 py-3 bg-blue-600 text-white font-semibold rounded-md shadow-sm hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 disabled:opacity-50 disabled:cursor-not-allowed"
      >
        Create Batch
      </button>
    </form>
  </div>
</div>
