<div class="p-4 md:p-0">
  <div class="flex justify-between items-center">
    <div class="flex gap-2">
      <img
        src="../../../../../assets/icons/back-arrow.svg"
        alt=""
        class="cursor-pointer"
      />
      <h1 class="text-xl md:text-3xl font-bold text-content">Lesson Plan</h1>
    </div>
  </div>
  <div
    class="flex flex-col md:flex-row main-container mt-4"
    [ngClass]="expandedContainer ? 'gap-0' : 'gap-4'"
  >
    <div
      class="flex flex-col transition-all duration-900 ease-in-out"
      [ngClass]="expandedContainer ? 'w-0' : 'w-full md:w-1/5'"
    >
      <div
        class="hidden md:block flex-[70%] overflow-y-auto bg-white border-r border-gray-200 rounded-t-md shadow-sm section-navigation"
        *ngIf="!expandedContainer"
      >
        <div
          class="flex items-center justify-between sticky top-0 bg-white z-10 font-semibold text-content p-4"
        >
          {{ activeTab() }}
          <button *ngIf="!expandedContainer" (click)="expandedContainer = true">
            <img src="../../../../../assets/icons/left-arrow.svg" alt="" />
          </button>
        </div>
        <ng-container>
          <ng-container *ngFor="let section of sections">
            <div
              *ngIf="!section?.isAdditional"
              class="cursor-pointer px-4 py-2 border-b text-content"
              (click)="scrollToSection(section.id)"
              [ngClass]="{
                'bg-primary-40 text-primary font-bold':
                  activeSectionId === section.id
              }"
            >
              {{ section.title }}
            </div>
          </ng-container>
        </ng-container>
      </div>
      <button
        (click)="toggleAccordion()"
        class="w-full text-left px-4 py-2 text-primary text-sm bg-primary-40 shadow-sm border-r border-gray-200"
        *ngIf="!expandedContainer"
      >
        <div class="flex items-center justify-between">
          <p class="font-semibold">Chapter Details</p>
          <img
            class="md:hidden"
            src="{{
              isOpen
                ? '../../../../../assets/icons/up-drop.svg'
                : '../../../../../assets/icons/down-drop.svg'
            }}"
            alt=""
          />
        </div>
      </button>
      <div
        *ngIf="isOpen && !expandedContainer && subjectDetails"
        class="flex-[30%] p-4 overflow-y-auto bg-white border-r border-gray-200 text-sm rounded-b-md shadow-sm section-navigation transition-all duration-1200 ease-in-out"
      >
        <app-lesson-plan-subject-details
          [subjectDetails]="subjectDetails"
        ></app-lesson-plan-subject-details>
      </div>
    </div>

    <div
      class="pb-8 overflow-x-hidden overflow-y-auto scroll-smooth bg-white rounded-md content-container group relative transition-all duration-1200 ease-in-out"
      #contentContainer
      [ngClass]="expandedContainer ? 'w-full  md:w-full' : 'md:w-4/5'"
    >
      <div class="flex border-b border-gray-200 sticky top-0 bg-white z-10">
        <button
          class="px-4 py-2 -mb-px"
          *ngIf="expandedContainer"
          (click)="expandedContainer = false"
        >
          <img src="../../../../../assets/icons/menu.svg" alt="" />
        </button>
        <button
          class="px-4 py-2 -mb-px border-b-2 border-primary text-primary font-bold"
        >
          Lesson Plan
        </button>
      </div>

      <div>
        <app-lesson-plan-formats
          [sections]="sections"
        ></app-lesson-plan-formats>
      </div>
    </div>
  </div>
</div>
