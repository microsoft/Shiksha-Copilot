<div *ngIf="!videoUrls.length" class="flex flex-col items-center">
  <img src="../../../../../assets/icons/youtube.svg" alt="" />
  <p class="text-content-70">{{ 'Videos Not Found' | translate}}</p>
</div>
<div class="grid grid-cols-2 gap-4" *ngIf="videoUrls.length">
  <div *ngFor="let video of videoUrls">
    <div
      class="bg-white border"
      [attr.id]="video.title"
      (click)="updateTitle(video?.title)"
    >
      <div class="bg-shade-80 p-3 rounded">
        <iframe
          [src]="video.link"
          width="100%"
          height="200"
          title="YouTube video player"
          frameborder="0"
          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
          referrerpolicy="strict-origin-when-cross-origin"
          allowfullscreen
        >
        </iframe>
      </div>
      <div class="p-2">
        <p class="text-center text-nowrap overflow-x-auto text-ellipsis">
          {{ video?.title }}
        </p>
      </div>
    </div>
  </div>
</div>
